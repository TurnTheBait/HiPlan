[tool.pyrefly]
python-version = "3.13"
python-path = "backend/venv/bin/python"
search-paths = [
    ".",
    "backend",
    "backend/venv/lib/python3.13/site-packages"
]
project-excludes = [
    "**/__pyrefly_virtual__/**"
]

[tool.pyright]
venvPath = "."
venv = "backend/venv"
extraPaths = [
    ".",
    "backend",
    "backend/venv/lib/python3.13/site-packages"
]
exclude = [
    "**/__pyrefly_virtual__/**"
]
